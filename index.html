<!doctype html>
<html lang="es-CR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Trato Hecho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Diseño: una mesa de negociación limpia. Hueso claro de fondo, superficies blancas, tinta
   azul marino, un verde de sello para «trato hecho». Cada bando con su color: cobalto la
   agencia, ciruela el cliente. Sora para los titulares, Manrope para leer, JetBrains Mono
   para códigos y relojes. Tarjetas suaves, chips para elegir, un termómetro para los puntos. */
:root {
  --fondo: #f4f4f1; --superficie: #ffffff; --superficie-2: #ebedf0; --superficie-3: #f7f8fa;
  --tinta: #141a2e; --tinta-2: #4b5367; --tinta-3: #868c9e; --linea: #e2e5ea; --linea-2: #cfd4dc;
  --acento: #0d7d63; --acento-tinta: #ffffff; --acento-suave: #dcf3ea;
  --agencia: #2457c5; --agencia-suave: #e3ebfb;
  --cliente: #9a3a86; --cliente-suave: #f5e4f2;
  --ok: #1f8a46; --ok-suave: #ddf5e5; --aviso: #b45f06; --aviso-suave: #fdebd0; --mal: #c2271d; --mal-suave: #fbe1de;
  --destacado: #fff4c2;
  --sombra: 0 1px 2px rgba(20, 26, 46, .05), 0 12px 32px rgba(20, 26, 46, .06);
  --display: "Sora", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --texto: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace;
  --radio: 14px; --radio-s: 9px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --fondo: #0f1320; --superficie: #171c2b; --superficie-2: #222839; --superficie-3: #1c2232;
    --tinta: #eceef3; --tinta-2: #b4bac9; --tinta-3: #7f869a; --linea: #2a3144; --linea-2: #3a4257;
    --acento: #39c99f; --acento-tinta: #06201a; --acento-suave: #163b31;
    --agencia: #8db0ff; --agencia-suave: #1c2a4d;
    --cliente: #e49bd4; --cliente-suave: #3b2238;
    --ok: #5fd184; --ok-suave: #16351f; --aviso: #f1b64f; --aviso-suave: #3f2f12; --mal: #ff8a80; --mal-suave: #44201f;
    --destacado: #3b3414; --sombra: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --fondo: #0f1320; --superficie: #171c2b; --superficie-2: #222839; --superficie-3: #1c2232;
  --tinta: #eceef3; --tinta-2: #b4bac9; --tinta-3: #7f869a; --linea: #2a3144; --linea-2: #3a4257;
  --acento: #39c99f; --acento-tinta: #06201a; --acento-suave: #163b31;
  --agencia: #8db0ff; --agencia-suave: #1c2a4d;
  --cliente: #e49bd4; --cliente-suave: #3b2238;
  --ok: #5fd184; --ok-suave: #16351f; --aviso: #f1b64f; --aviso-suave: #3f2f12; --mal: #ff8a80; --mal-suave: #44201f;
  --destacado: #3b3414; --sombra: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--fondo); color: var(--tinta); font-family: var(--texto); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: clamp(1.9rem, 5vw, 2.8rem); font-weight: 800; }
h2 { font-size: clamp(1.3rem, 3vw, 1.65rem); font-weight: 700; }
h3 { font-size: 1.05rem; font-weight: 700; }
p { margin: 0; }
a { color: var(--acento); text-underline-offset: .15em; }
button { font: inherit; }
code, .mono { font-family: var(--mono); }
:focus-visible { outline: 3px solid var(--acento); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- barra ---------- */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--superficie); border-bottom: 1px solid var(--linea); padding-inline: 16px; }
.barra-interior { max-width: 1040px; margin: 0 auto; min-height: 56px; display: flex; align-items: center; gap: 10px 16px; flex-wrap: wrap; padding-block: 8px; }
.marca { display: inline-flex; align-items: center; gap: 9px; font-family: var(--display); font-weight: 800; font-size: 1.12rem; color: var(--tinta); text-decoration: none; letter-spacing: -.02em; }
.marca::before { content: ""; width: 12px; height: 12px; border-radius: 3px; background: var(--acento); transform: rotate(-12deg); }
.barra nav { display: flex; gap: 2px; flex-wrap: wrap; margin-left: auto; font-size: .9rem; }
.barra nav a { color: var(--tinta-2); text-decoration: none; padding: 6px 10px; border-radius: 999px; font-weight: 600; }
.barra nav a.activo { color: var(--tinta); background: var(--superficie-2); }
.chip-sala { font-size: .82rem; font-weight: 700; padding: 5px 11px; border-radius: 999px; background: var(--superficie-2); color: var(--tinta-2); white-space: nowrap; }
.chip-sala.agencia { background: var(--agencia-suave); color: var(--agencia); }
.chip-sala.cliente { background: var(--cliente-suave); color: var(--cliente); }
.reloj-mini { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: .9rem; padding: 5px 11px; border-radius: 8px; background: var(--tinta); color: var(--fondo); white-space: nowrap; }
.reloj-mini.alerta { background: var(--mal); color: #fff; }

/* ---------- base ---------- */
.contenido { max-width: 1040px; margin: 0 auto; padding-inline: 16px; padding-block: 26px 72px; display: grid; gap: 26px; }
.seccion { display: grid; gap: 14px; min-width: 0; }
.seccion > p, .seccion li { max-width: 70ch; }
.ojo { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--tinta-3); }
.entrada { color: var(--tinta-2); font-size: 1.05rem; max-width: 62ch; }
.tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 20px; box-shadow: var(--sombra); min-width: 0; }
.tarjeta.suave { background: var(--superficie-3); border-color: transparent; box-shadow: none; }
.tarjeta.agencia { border-top: 4px solid var(--agencia); }
.tarjeta.cliente { border-top: 4px solid var(--cliente); }
.dos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
.tres { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
ol.reglas, ol.pasos { margin: 0; padding-left: 1.4em; display: grid; gap: 8px; }
ul.lista { margin: 0; padding-left: 1.2em; display: grid; gap: 8px; }
.nota-pie { color: var(--tinta-3); font-size: .9rem; }
.fases { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.fase { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--radio); padding: 14px 16px; display: grid; gap: 2px; }
.fase b { font-family: var(--display); font-size: 1rem; }
.fase span { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--acento); font-weight: 700; font-size: .95rem; }
.fase small { color: var(--tinta-3); font-size: .85rem; }

/* ---------- controles ---------- */
.boton { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 11px 18px; border-radius: 999px; border: 1px solid transparent; cursor: pointer; font-weight: 700; text-decoration: none; line-height: 1.2; min-height: 44px; background: var(--superficie-2); color: var(--tinta); }
.boton.primario { background: var(--acento); color: var(--acento-tinta); }
.boton.contorno { background: transparent; border-color: var(--linea-2); color: var(--tinta); }
.boton.peligro { background: transparent; border-color: var(--mal); color: var(--mal); }
.boton.chico { min-height: 34px; padding: 5px 12px; font-size: .88rem; }
.boton:disabled { opacity: .45; cursor: not-allowed; }
.boton.grande { font-size: 1.05rem; padding: 15px 26px; }
.botones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
label.campo { display: grid; gap: 6px; font-weight: 700; font-size: .92rem; }
input[type="number"], input[type="text"], input[type="password"], textarea, select { font: inherit; color: var(--tinta); background: var(--superficie); border: 1px solid var(--linea-2); border-radius: var(--radio-s); padding: 10px 12px; width: 100%; min-width: 0; }
textarea { min-height: 68px; resize: vertical; }
.lados { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lado-boton { display: grid; gap: 3px; text-align: left; padding: 14px 16px; border-radius: var(--radio); cursor: pointer; border: 2px solid var(--linea); background: var(--superficie); color: var(--tinta); min-height: 84px; }
.lado-boton b { font-family: var(--display); font-size: 1.15rem; }
.lado-boton span { color: var(--tinta-2); font-size: .9rem; }
.lado-boton.agencia[aria-pressed="true"] { border-color: var(--agencia); background: var(--agencia-suave); }
.lado-boton.cliente[aria-pressed="true"] { border-color: var(--cliente); background: var(--cliente-suave); }
.roles { display: flex; gap: 8px; flex-wrap: wrap; }
.rol-boton { flex: 1 1 140px; display: grid; gap: 2px; text-align: left; padding: 10px 14px; border-radius: var(--radio-s); cursor: pointer; border: 2px solid var(--linea); background: var(--superficie); color: var(--tinta); }
.rol-boton b { font-family: var(--display); }
.rol-boton span { color: var(--tinta-2); font-size: .85rem; }
.rol-boton[aria-pressed="true"] { border-color: var(--acento); background: var(--acento-suave); }
@media (max-width: 480px) { .lados { grid-template-columns: 1fr; } }

/* ---------- lobby y presencia ---------- */
.lobby { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.sala-lobby { background: var(--superficie); border: 1.5px solid var(--linea); border-radius: var(--radio); padding: 12px 12px 10px; display: grid; gap: 10px; }
.sala-lobby.elegida { border-color: var(--acento); box-shadow: 0 0 0 3px var(--acento-suave); }
.sala-lobby-cab { display: flex; justify-content: space-between; align-items: baseline; }
.sala-lobby-cab b { font-family: var(--display); font-size: 1.05rem; }
.lados-lobby { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lado-col { display: grid; gap: 8px; align-content: start; text-align: left; padding: 10px; border-radius: var(--radio-s); border: 1.5px dashed var(--linea-2); background: var(--superficie-3); cursor: pointer; color: var(--tinta); font: inherit; min-height: 118px; }
.lado-col .lado-col-cab { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 800; }
.lado-col.agencia[aria-pressed="true"] { border: 2px solid var(--agencia); background: var(--agencia-suave); }
.lado-col.cliente[aria-pressed="true"] { border: 2px solid var(--cliente); background: var(--cliente-suave); }
.asiento { display: flex; align-items: center; gap: 8px; min-width: 0; }
.asiento .avatar { position: relative; width: 34px; height: 34px; border-radius: 50%; flex: 0 0 auto; display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: .8rem; color: #fff; background: var(--tinta-3); }
.asiento.agencia .avatar { background: var(--agencia); } .asiento.cliente .avatar { background: var(--cliente); }
.asiento .rolb { position: absolute; right: -6px; bottom: -4px; font-family: var(--mono); font-size: .6rem; font-weight: 700; padding: 1px 4px; border-radius: 999px; background: var(--superficie); color: var(--tinta); border: 1px solid var(--linea-2); line-height: 1.3; }
.asiento .nombre { font-size: .9rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asiento.yo .nombre::after { content: " (yo)"; color: var(--tinta-3); font-weight: 500; }
.asiento.vacio .avatar { background: transparent; border: 2px dashed var(--linea-2); }
.asiento.vacio .nombre { color: var(--tinta-3); font-weight: 500; }
@media (prefers-reduced-motion: no-preference) { .asiento:not(.vacio) { animation: llegar .35s cubic-bezier(.2,.8,.2,1) both; } @keyframes llegar { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: none; } } }
.presencia { display: flex; gap: 10px 18px; flex-wrap: wrap; align-items: center; padding: 10px 14px; border-radius: var(--radio-s); background: var(--superficie); border: 1px solid var(--linea); }
.presencia-lado { display: grid; gap: 6px; }
.presencia-lado .asientos { display: flex; gap: 10px 14px; flex-wrap: wrap; }
.presencia-vs { font-family: var(--display); font-weight: 800; color: var(--tinta-3); font-size: .85rem; }
.lado-linea .nombres { font-weight: 600; color: var(--tinta); }
.lado-linea .nombres small { font-family: var(--mono); font-size: .7rem; color: var(--tinta-3); }

/* ---------- pestañas ---------- */
.tabs { display: flex; gap: 4px; padding: 4px; background: var(--superficie-2); border-radius: 999px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; border: 0; background: transparent; color: var(--tinta-2); font-weight: 700; font-size: .9rem; padding: 8px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; min-height: 38px; }
.tab[aria-selected="true"] { background: var(--superficie); color: var(--tinta); box-shadow: 0 1px 2px rgba(20, 26, 46, .08); }
.panel-tab[hidden] { display: none; }

/* ---------- ficha ---------- */
.cabecera { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; }
.titulo-lado em { font-style: normal; }
.titulo-lado.agencia em, .acento-agencia { color: var(--agencia); }
.titulo-lado.cliente em, .acento-cliente { color: var(--cliente); }
.reloj { display: grid; justify-items: center; gap: 6px; padding: 14px 18px; border-radius: var(--radio); background: var(--tinta); color: var(--fondo); min-width: 200px; }
.reloj .fase-actual { font-size: .74rem; letter-spacing: .1em; text-transform: uppercase; opacity: .8; font-weight: 700; }
.reloj .tiempo { font-family: var(--mono); font-variant-numeric: tabular-nums; font-weight: 700; font-size: 2.4rem; line-height: 1; }
.reloj.alerta { background: var(--mal); color: #fff; }
.reloj .boton { min-height: 34px; padding: 5px 14px; background: var(--fondo); color: var(--tinta); }
.reloj.grande .tiempo { font-size: clamp(4rem, 18vw, 9rem); }
.reloj-nota { font-size: .8rem; opacity: .85; }
.intereses { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: interes; }
.intereses li { display: grid; grid-template-columns: 30px 1fr; gap: 10px; align-items: start; }
.intereses li::before { counter-increment: interes; content: counter(interes); font-family: var(--display); font-weight: 800; font-size: 1.2rem; color: var(--acento); line-height: 1.3; }
.intereses b { display: block; }
.plan-b { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
.plan-b .numero { font-family: var(--display); font-weight: 800; font-size: 3rem; line-height: 1; color: var(--mal); }
.plan-b .numero small { display: block; font-family: var(--texto); font-weight: 700; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tinta-3); }
.posicion { font-family: var(--display); font-weight: 500; font-size: 1.15rem; line-height: 1.4; }
.trabajo { display: grid; gap: 8px; border-left: 4px solid var(--acento); }
.trabajo .ojo { color: var(--acento); }
.monedas { display: grid; gap: 8px; }
.moneda { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: var(--radio-s); background: var(--superficie-3); }
.moneda b { font-family: var(--display); font-size: .98rem; }
.moneda .peso { font-family: var(--mono); font-weight: 700; color: var(--tinta-2); }
.moneda.defender { border-left: 3px solid var(--agencia); }
.moneda.cambiar { border-left: 3px solid var(--acento); }

/* ---------- tablas ---------- */
.tabla-envoltorio { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { border-collapse: collapse; width: 100%; font-size: .94rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--linea); vertical-align: top; }
th { font-size: .74rem; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); font-weight: 700; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.sala { white-space: nowrap; }
td.mono { font-family: var(--mono); font-weight: 700; }
tr.tema-inicio td { border-top: 2px solid var(--linea-2); }
tr.mejor td { background: var(--destacado); }
tr.invalido td { color: var(--tinta-3); }
td.max { font-weight: 800; color: var(--acento); }
.estado { display: inline-block; font-size: .78rem; font-weight: 700; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.estado.ok { background: var(--ok-suave); color: var(--ok); }
.estado.mal { background: var(--mal-suave); color: var(--mal); }
.estado.aviso { background: var(--aviso-suave); color: var(--aviso); }
.estado.neutro { background: var(--superficie-2); color: var(--tinta-2); }
.estado.mejor { background: var(--tinta); color: var(--fondo); }
.estado.info { background: var(--agencia-suave); color: var(--agencia); }

/* ---------- mesa ---------- */
.mesa-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 880px) { .mesa-grid { grid-template-columns: 1fr; } }
.apuntes { position: sticky; top: calc(66px + env(safe-area-inset-top, 0px)); display: grid; gap: 14px; }
@media (max-width: 880px) { .apuntes { display: contents; } .apuntes .arriba { order: -1; } .apuntes .laboratorio { order: -2; } .mesa-grid { gap: 12px; } }
@media (min-width: 881px) { .apuntes { max-height: calc(100vh - 90px); overflow: auto; padding-right: 2px; } }
.clausulas { display: grid; gap: 12px; }
.clausula { display: grid; gap: 8px; padding: 14px 16px; }
.clausula-cab { display: flex; gap: 8px 12px; align-items: baseline; flex-wrap: wrap; }
.clausula-cab .n { font-family: var(--mono); font-weight: 700; color: var(--tinta-3); font-size: .82rem; }
.clausula-cab h3 { font-size: 1rem; }
.clausula-cab .pregunta { color: var(--tinta-3); font-size: .88rem; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { position: relative; display: inline-flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 999px; border: 1.5px solid var(--linea-2); background: var(--superficie); cursor: pointer; font-size: .92rem; line-height: 1.2; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip .letra { font-family: var(--mono); font-weight: 700; font-size: .8rem; width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--superficie-2); color: var(--tinta-2); }
.chip .pts { font-family: var(--mono); font-weight: 700; font-size: .82rem; color: var(--tinta-3); }
.chip:has(input:checked), .chip[aria-pressed="true"] { border-color: var(--acento); background: var(--acento-suave); }
.chip:has(input:checked) .letra, .chip[aria-pressed="true"] .letra { background: var(--acento); color: var(--acento-tinta); }
.chip:has(input:checked) .pts { color: var(--acento); }
.chip:has(input:focus-visible) { outline: 3px solid var(--acento); outline-offset: 2px; }
.termometro { display: grid; gap: 8px; }
.termometro-cab { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.termometro-cab .total { font-family: var(--display); font-weight: 800; font-size: 2rem; line-height: 1; }
.termometro-cab .total small { font-family: var(--texto); font-weight: 600; font-size: .82rem; color: var(--tinta-3); margin-left: 6px; }
.barra-pts { position: relative; height: 14px; border-radius: 999px; background: var(--superficie-2); overflow: visible; }
.barra-pts .lleno { height: 100%; border-radius: 999px; background: var(--acento); width: 0; transition: width .25s; }
.barra-pts .lleno.mal { background: var(--mal); }
.barra-pts .marca { position: absolute; top: -5px; width: 3px; height: 24px; background: var(--tinta); border-radius: 2px; }
.barra-pts .marca::after { content: "plan B"; position: absolute; top: 26px; left: 50%; transform: translateX(-50%); font-size: .7rem; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--tinta-3); white-space: nowrap; }
.termometro .veredicto { font-weight: 700; font-size: .92rem; margin-top: 14px; }
.veredicto.ok { color: var(--ok); } .veredicto.mal { color: var(--mal); }
.propuesta-resumen { display: grid; gap: 6px; font-size: .9rem; }
.propuesta-resumen .fila { display: grid; grid-template-columns: minmax(104px, 36%) 1fr; gap: 10px; align-items: baseline; }
